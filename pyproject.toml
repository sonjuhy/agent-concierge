[project]
license = "Apache-2.0"
name = "agent"
version = "0.1.0"
description = "개인 AI 에이전트 코어 데몬 (Slack + agy + claude -p + Obsidian)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "apscheduler>=3.11,<4",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "markitdown[docx,pptx,xlsx]>=0.1.9",
    "pymupdf>=2.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.30.0",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/indexer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
